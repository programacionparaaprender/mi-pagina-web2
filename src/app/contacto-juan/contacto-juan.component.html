
<div class="container-fluid">

  @for (contacto of contactosjs; track contacto) {
    <div class="row">
      <!-- <a target="_blank" href="{{contacto.url}}"></a> -->
      @if (contacto.id==3) {
        <div class="col-sm-6 col-md-3">
          <a target="_blank" href="{{contacto.url}}">
            <img src="{{contacto.img}}" style="width:100%">
          </a>
          <h3>{{contacto.nombre}}</h3>
          <p>{{contacto.titulo}}</p>
          <p>{{contacto.descripcion}}</p>
        </div>
      }
    </div>
  }
</div>

<!-- Page content -->
<div class="container-fluid" style="max-width:1564px">
  <h1 style="text-align: center;">ASESOR COMERCIAL</h1>
  <h2>
    ASESORÍA (A nivel nacional)
  </h2>
  <h3>
    <ul>
      <li>Presupuestos</li>
    </ul>
  </h3>
</div>
